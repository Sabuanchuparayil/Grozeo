upstream bizapi {
    server 127.0.0.1:8001;
    keepalive 32;
}

upstream scheduler {
    server 127.0.0.1:8002;
    keepalive 16;
}

upstream public_web {
    server 127.0.0.1:5000;
    keepalive 32;
}

upstream partner {
    server 127.0.0.1:5001;
    keepalive 16;
}

upstream bizadmin {
    server 127.0.0.1:8003;
    keepalive 16;
}

upstream manage_products {
    server 127.0.0.1:8004;
    keepalive 16;
}

upstream finascop_app {
    server 127.0.0.1:8005;
    keepalive 16;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# API Gateway — bizapi.grozeo.in
server {
    listen 443 ssl http2;
    server_name bizapi.grozeo.in;

    ssl_certificate     /etc/ssl/certs/grozeo.in.crt;
    ssl_certificate_key /etc/ssl/private/grozeo.in.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    # Health check — no rate limit
    location /health {
        proxy_pass http://bizapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Auth endpoints — stricter rate limit
    location ~ ^/api/v1/(login|register|otp|forgot-password) {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_conn conn_limit 10;
        proxy_pass http://bizapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API routes
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 50;
        proxy_pass http://bizapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Caching for GET requests on product/category endpoints
        proxy_cache_valid 200 5m;
        proxy_cache_bypass $http_authorization;
    }

    # Payment callbacks — no rate limit
    location /payment/ {
        proxy_pass http://bizapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://bizapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Public storefront — *.grozeo.in
server {
    listen 443 ssl http2;
    server_name *.grozeo.in;

    ssl_certificate     /etc/ssl/certs/grozeo.in.crt;
    ssl_certificate_key /etc/ssl/private/grozeo.in.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    location /health {
        proxy_pass http://public_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Static assets — long cache
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://public_web;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        limit_req zone=api_limit burst=100 nodelay;
        proxy_pass http://public_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

