version: "3.8"

services:
  # === Core Services ===

  bizapi:
    build:
      context: ./Grozeo-Bizapi
      dockerfile: Dockerfile
    container_name: grozeo-bizapi
    restart: unless-stopped
    ports:
      - "8001:80"
    env_file:
      - ./Grozeo-Bizapi/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - grozeo-network
    volumes:
      - bizapi-storage:/var/www/html/storage

  scheduler:
    build:
      context: ./Grozeo-Scheduler
      dockerfile: Dockerfile
    container_name: grozeo-scheduler
    restart: unless-stopped
    ports:
      - "8002:8080"
    env_file:
      - ./Grozeo-Scheduler/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - grozeo-network
    volumes:
      - scheduler-storage:/var/www/html/storage

  public:
    build:
      context: ./Grozeo-Public
      dockerfile: Dockerfile
    container_name: grozeo-public
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/Health/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - grozeo-network

  partner:
    build:
      context: ./Grozeo-Partner
      dockerfile: Dockerfile
    container_name: grozeo-partner
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5001
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - grozeo-network

  bizadmin:
    build:
      context: ./Grozeo-Bizadmin
      dockerfile: Dockerfile
    container_name: grozeo-bizadmin
    restart: unless-stopped
    ports:
      - "8003:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - grozeo-network

  manage-products:
    build:
      context: ./Manage-Products
      dockerfile: Dockerfile
    container_name: grozeo-manage-products
    restart: unless-stopped
    ports:
      - "8004:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - grozeo-network

  finascop:
    build:
      context: ./finascop
      dockerfile: Dockerfile
    container_name: grozeo-finascop
    restart: unless-stopped
    ports:
      - "8005:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - grozeo-network

  # === Infrastructure ===

  mysql:
    image: mysql:8.0
    container_name: grozeo-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${DB_DATABASE:-grozeo}
      MYSQL_USER: ${DB_USERNAME:-grozeo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./setup/super-admin-seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - grozeo-network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=500
      - --innodb-buffer-pool-size=512M
      - --slow-query-log=1
      - --long-query-time=2

  redis:
    image: redis:7-alpine
    container_name: grozeo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - grozeo-network

  # === Reverse Proxy ===

  nginx:
    image: nginx:alpine
    container_name: grozeo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./setup/nginx-api-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./setup/ssl:/etc/ssl:ro
    depends_on:
      bizapi:
        condition: service_healthy
      public:
        condition: service_healthy
    networks:
      - grozeo-network

volumes:
  mysql-data:
  redis-data:
  bizapi-storage:
  scheduler-storage:

networks:
  grozeo-network:
    driver: bridge
