[phases.setup]
nixPkgs = [
  "php84",
  "php84Extensions.pdo_mysql",
  "php84Extensions.redis",
  "php84Extensions.mbstring",
  "php84Extensions.xml",
  "php84Extensions.curl",
  "php84Extensions.gd",
  "php84Extensions.zip",
  "php84Extensions.bcmath",
  "php84Extensions.intl",
  "php84Extensions.opcache",
  "php84Extensions.pcntl",
  "composer"
]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = [
  "php artisan config:clear",
  "php artisan route:clear",
  "php artisan view:clear"
]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
