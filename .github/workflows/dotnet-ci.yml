name: .NET Services CI

on:
  push:
    branches: [main, develop, staging]
    paths:
      - 'Grozeo-Public/**'
      - 'Grozeo-Partner/**'
      - 'finascop/**'
      - '.github/workflows/dotnet-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Grozeo-Public/**'
      - 'Grozeo-Partner/**'
      - 'finascop/**'

jobs:
  build-public:
    name: Build Grozeo-Public (.NET 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore Grozeo-Public/Retaline/Retaline.Web.csproj

      - name: Build
        run: dotnet build Grozeo-Public/Retaline/Retaline.Web.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Grozeo-Public/Retaline/Retaline.Web.csproj --configuration Release --output ./publish --no-build

  build-partner:
    name: Build Grozeo-Partner (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find solution/project file
        run: |
          find Grozeo-Partner -name "*.csproj" -o -name "*.sln" | head -5

      - name: Restore & Build
        run: |
          PROJECT=$(find Grozeo-Partner -name "*.sln" -o -name "*.csproj" | head -1)
          if [ -n "$PROJECT" ]; then
            dotnet restore "$PROJECT"
            dotnet build "$PROJECT" --configuration Release --no-restore
          else
            echo "No .NET project file found, skipping build"
          fi

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [build-public]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4

      - name: Build Grozeo-Public Docker image
        run: |
          if [ -f Grozeo-Public/Dockerfile ]; then
            docker build -t grozeo-public:${{ github.sha }} Grozeo-Public/
          else
            echo "No Dockerfile found, skipping"
          fi
