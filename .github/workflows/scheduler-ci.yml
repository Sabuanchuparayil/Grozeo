name: Scheduler CI

on:
  push:
    branches: [main, develop, staging]
    paths:
      - 'Grozeo-Scheduler/**'
      - '.github/workflows/scheduler-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Grozeo-Scheduler/**'

defaults:
  run:
    working-directory: Grozeo-Scheduler

jobs:
  lint:
    name: Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: Grozeo-Scheduler/vendor
          key: ${{ runner.os }}-scheduler-composer-${{ hashFiles('Grozeo-Scheduler/composer.lock') }}
          restore-keys: ${{ runner.os }}-scheduler-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: grozeo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, redis
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy env file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Verify artisan commands
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: grozeo_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan config:clear

      - name: Security audit
        run: composer audit
